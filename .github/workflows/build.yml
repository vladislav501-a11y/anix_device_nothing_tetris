name: Build Anix OS (OFFICIAL) for CMF Phone 1 (tetris)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnixOS Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space via LVM
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          overprovision-lvm: 'true'

      - name: Clean Runner Bloat
        run: |
          echo "=== Freeing up maximum disk space on runner ==="
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/share/kotlinc
          sudo docker system prune -a -f --volumes || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libncurses6 libx11-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 rsync ccache
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Initialize Evolution X Source (Optimized Groups)
        run: |
          export PATH=~/bin:$PATH
          mkdir -p ~/anix
          cd ~/anix
          git config --global user.name "#archsu"
          git config --global user.email "archsu@anixos.org"
          git config --global color.ui false
          repo init -u https://github.com/Evolution-X/manifest -b bka --depth=1 --no-clone-bundle --groups=all,-notdefault,-device,-darwin,-x86,-mips
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --current-branch
          echo "Purging .repo store to recover space..."
          rm -rf ~/anix/.repo
          df -h /

      - name: Clone Device, Vendor and Kernel Trees
        run: |
          cd ~/anix
          git clone --depth=1 https://github.com/Evolution-X-Devices/device_nothing_Tetris -b bka device/nothing/Tetris
          git clone --depth=1 https://github.com/Evolution-X-Devices/device_nothing_Tetris-kernel -b bka device/nothing/Tetris-kernel
          git clone --depth=1 https://github.com/Evolution-X-Devices/vendor_nothing_Tetris -b bka vendor/nothing/Tetris
          git clone --depth=1 https://github.com/Evolution-X-Devices/hardware_mediatek -b bka hardware/mediatek
          git clone --depth=1 https://github.com/swiitch-OFF-Lab/hardware_dolby -b sony-1.5 hardware/dolby
          git clone --depth=1 https://github.com/swiitch-OFF-Lab/packages_apps_DolbyUI -b a packages/apps/DolbyUI
          rm -rf device/nothing/Tetris/.git device/nothing/Tetris-kernel/.git vendor/nothing/Tetris/.git hardware/mediatek/.git
          df -h /

      - name: Resolve Soong Namespace Conflicts
        run: |
          echo "Resolving namespace conflicts between device/nothing/Tetris and hardware/mediatek..."
          echo 'SOONG_CONFIG_NAMESPACES += mediatek_gadget' >> ~/anix/device/nothing/Tetris/BoardConfig.mk
          echo 'SOONG_CONFIG_mediatek_gadget += use_custom_usb_gadget_rc' >> ~/anix/device/nothing/Tetris/BoardConfig.mk
          echo 'SOONG_CONFIG_mediatek_gadget_use_custom_usb_gadget_rc := true' >> ~/anix/device/nothing/Tetris/BoardConfig.mk

      - name: Apply Anix OS Customizations
        run: |
          echo "Injecting Anix OS bootanimation and branding..."
          mkdir -p ~/anix/vendor/anix
          cp -r $GITHUB_WORKSPACE/overlay/* ~/anix/vendor/anix/ 2>/dev/null || true
          if [ -f $GITHUB_WORKSPACE/bootanimation.zip ]; then
            mkdir -p ~/anix/vendor/lineage/bootanimation/prebuilts
            cp $GITHUB_WORKSPACE/bootanimation.zip ~/anix/vendor/lineage/bootanimation/prebuilts/1080.zip || true
          fi
          echo '$(call inherit-product-if-exists, vendor/anix/anix_config.mk)' >> ~/anix/device/nothing/Tetris/lineage_Tetris.mk

      - name: Build ROM
        run: |
          cd ~/anix
          source build/envsetup.sh
          lunch lineage_Tetris-userdebug
          m evolution

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AnixOS-Tetris-Build
          path: |
            /home/runner/anix/out/target/product/Tetris/*.zip
            /home/runner/anix/out/target/product/Tetris/boot.img
            /home/runner/anix/out/target/product/Tetris/vendor_boot.img
            /home/runner/anix/out/target/product/Tetris/dtbo.img
            /home/runner/anix/out/target/product/Tetris/recovery.img
